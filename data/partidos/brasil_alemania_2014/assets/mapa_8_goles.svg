<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="auto">
  <defs>
    <style>
      .pitch-bg { fill: #0d2316; }
      .pitch-stripes { fill: rgba(255, 255, 255, 0.025); }
      .line { stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; fill: none; }
      .spot { fill: rgba(255, 255, 255, 0.8); }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; font-size: 18px; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: rgba(255, 255, 255, 0.7); }
      .txt-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: rgba(255, 255, 255, 0.85); font-weight: 500; }
      .txt-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
      .txt-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .goal-germany { fill: #10b981; stroke: #ffffff; stroke-width: 2; }
      .goal-brazil { fill: #f59e0b; stroke: #ffffff; stroke-width: 2; }
    </style>
    <pattern id="stripes" width="116" height="660" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="58" height="660" class="pitch-stripes"/>
    </pattern>
  </defs>

  <!-- Fondo general -->
  <rect x="0" y="0" width="1200" height="750" fill="#09180f" rx="12"/>

  <!-- Encabezado / Título -->
  <text x="30" y="32" class="txt-title">MAPA DE REMATES DE LOS 8 GOLES — BRASIL 1–7 ALEMANIA</text>
  <text x="30" y="49" class="txt-sub">Sistema de Coordenadas de Cancha OMNIMORPH (12000 × 7000 cm) | El tamaño del punto escala con el xG</text>

  <!-- Leyenda superior -->
  <circle cx="880" cy="35" r="7" class="goal-germany"/>
  <text x="895" y="39" class="txt-legend">Alemania (7 goles)</text>
  <circle cx="1035" cy="35" r="7" class="goal-brazil"/>
  <text x="1050" y="39" class="txt-legend">Brasil (1 gol)</text>

  <!-- Campo de Fútbol (Dimensiones internas: 1160 x 660) -->
  <!-- x = 20 a 1180, y = 65 a 725 -->
  <g id="pitch">
    <!-- Césped -->
    <rect x="20" y="65" width="1160" height="660" class="pitch-bg" rx="6"/>
    <rect x="20" y="65" width="1160" height="660" fill="url(#stripes)" rx="6"/>

    <!-- Líneas exteriores -->
    <rect x="20" y="65" width="1160" height="660" class="line"/>

    <!-- Línea de medio campo -->
    <line x1="600" y1="65" x2="600" y2="725" class="line"/>
    <circle cx="600" cy="395" r="91.5" class="line"/>
    <circle cx="600" cy="395" r="3" class="spot"/>

    <!-- LADO IZQUIERDO: Portería de Brasil en el 1T (x = 0 cm) -->
    <!-- Área grande (16.5m -> 165px de profundidad, 40.3m -> 330px de alto) -->
    <rect x="20" y="230" width="165" height="330" class="line"/>
    <!-- Área chica (5.5m -> 55px de profundidad, 18.3m -> 180px de alto) -->
    <rect x="20" y="305" width="55" height="180" class="line"/>
    <!-- Punto de penal (11m -> 110px desde línea de meta) -->
    <circle cx="130" cy="395" r="3" class="spot"/>
    <!-- Arco del área penal -->
    <path d="M 185 330 A 91.5 91.5 0 0 1 185 460" class="line"/>
    <!-- Portería física (7.32m -> 74px de alto) -->
    <rect x="6" y="358" width="14" height="74" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
    <text x="35" y="85" class="txt-sub" font-size="11">← Meta Brasil (x=0, 1T)</text>

    <!-- LADO DERECHO: Portería de Alemania en el 1T (x = 12000 cm) -->
    <!-- Área grande -->
    <rect x="1015" y="230" width="165" height="330" class="line"/>
    <!-- Área chica -->
    <rect x="1125" y="305" width="55" height="180" class="line"/>
    <!-- Punto de penal -->
    <circle cx="1070" cy="395" r="3" class="spot"/>
    <!-- Arco del área penal -->
    <path d="M 1015 330 A 91.5 91.5 0 0 0 1015 460" class="line"/>
    <!-- Portería física -->
    <rect x="1180" y="358" width="14" height="74" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
    <text x="1045" y="85" class="txt-sub" font-size="11">Meta Alemania (x=12000) →</text>
  </g>

  <!-- Puntos de Goles con Radio Proporcional al xG y Etiquetas -->
  <!-- Mapeo exacto: cx = 20 + (pitch_x / 12000) * 1160 | cy = 65 + (pitch_y / 7000) * 660 -->

  <!-- Gol 1: 11' Thomas Müller (x=920, y=4150) -> cx=108.9, cy=456.3, xG: 0.35 -->
  <g id="goal-1">
    <circle cx="109" cy="456" r="9" class="goal-germany"/>
    <rect x="123" y="444" width="125" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="129" y="459" class="txt-label">11' Müller (xG 0.35)</text>
  </g>

  <!-- Gol 2: 23' Miroslav Klose (x=680, y=3450) -> cx=85.7, cy=390.2, xG: 0.65 -->
  <g id="goal-2">
    <circle cx="86" cy="390" r="13" class="goal-germany"/>
    <rect x="105" y="378" width="118" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="111" y="393" class="txt-label">23' Klose (xG 0.65)</text>
  </g>

  <!-- Gol 3: 24' Toni Kroos (x=1520, y=3800) -> cx=166.9, cy=423.1, xG: 0.38 -->
  <g id="goal-3">
    <circle cx="167" cy="423" r="10" class="goal-germany"/>
    <rect x="182" y="411" width="120" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="188" y="426" class="txt-label">24' Kroos (xG 0.38)</text>
  </g>

  <!-- Gol 4: 26' Toni Kroos (x=850, y=3600) -> cx=102.2, cy=404.3, xG: 0.88 -->
  <g id="goal-4">
    <circle cx="102" cy="404" r="15" class="goal-germany"/>
    <!-- Línea conector hacia la izquierda para no estorbar -->
    <line x1="102" y1="404" x2="35" y2="404" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
    <rect x="25" y="340" width="120" height="22" rx="4" fill="rgba(16,185,129,0.25)" stroke="#10b981" stroke-width="1"/>
    <text x="31" y="355" class="txt-label">26' Kroos (xG 0.88)</text>
  </g>

  <!-- Gol 5: 29' Sami Khedira (x=1120, y=3200) -> cx=128.3, cy=366.9, xG: 0.42 -->
  <g id="goal-5">
    <circle cx="128" cy="367" r="10" class="goal-germany"/>
    <rect x="143" y="325" width="130" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <line x1="128" y1="367" x2="143" y2="340" stroke="#10b981" stroke-width="1.2"/>
    <text x="149" y="340" class="txt-label">29' Khedira (xG 0.42)</text>
  </g>

  <!-- Gol 6: 69' André Schürrle (x=1050, y=3750) -> cx=121.5, cy=418.6, xG: 0.45 -->
  <g id="goal-6">
    <circle cx="122" cy="419" r="11" class="goal-germany"/>
    <rect x="138" y="480" width="135" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <line x1="122" y1="419" x2="138" y2="480" stroke="#10b981" stroke-width="1.2"/>
    <text x="144" y="495" class="txt-label">69' Schürrle (xG 0.45)</text>
  </g>

  <!-- Gol 7: 79' André Schürrle (x=880, y=2450) -> cx=105.1, cy=295.9, xG: 0.12 -->
  <g id="goal-7">
    <circle cx="105" cy="296" r="7" class="goal-germany"/>
    <rect x="120" y="275" width="135" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <line x1="105" y1="296" x2="120" y2="285" stroke="#10b981" stroke-width="1.2"/>
    <text x="126" y="290" class="txt-label">79' Schürrle (xG 0.12)</text>
  </g>

  <!-- Gol 8: 90' Oscar (x=10850, y=3650) -> cx=1068.8, cy=409.1, xG: 0.28 -->
  <g id="goal-8">
    <circle cx="1069" cy="409" r="9" class="goal-brazil"/>
    <rect x="920" y="398" width="135" height="22" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="926" y="413" class="txt-label">90' Oscar (xG 0.28)</text>
  </g>

  <!-- Resumen de Coordenadas en Pie de Gráfico -->
  <text x="30" y="742" class="txt-sub" font-size="11">Coordenadas exactas registradas en <tspan fill="#38bdf8">02_partido_completo/cronologia_goles.json</tspan></text>
</svg>
